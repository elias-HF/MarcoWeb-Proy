<!-- INTERFAZ DE INICIO -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../../css/sidebar.css">
</head>
<body>
    <div class="container-fluid w-100 m-0 p-4" id="panelPrincipal">
        
        <!-- Encabezado de la interfaz -->
        <header class="mb-4">
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-house-door fs-1 text-success"></i>
                <div>
                    <h2 class="fw-bold mb-1">Inicio</h2>
                    <p class="text-muted mb-0">
                        Bienvenido al sistema de gestión de recursos académicos.
                    </p>
                </div>
            </div>
        </header>

        <!-- Contenedor principal -->
        <section class="container-fluid">

            <!-- Resumen de la semana -->
            <section class="border rounded p-4 mb-4">

                <h4 class="fw-bold mb-4">
                    Resumen de la semana
                </h4>


                <div class="row g-3">

                    <!-- Préstamos -->
                    <article class="col-md-4">

                        <div class="border rounded p-4 text-center">

                            <i class="bi bi-box-arrow-up fs-1 text-success"></i>

                            <h5 class="mt-2">
                                Préstamos activos
                            </h5>

                            <h3>
                                12
                            </h3>

                        </div>

                    </article>


                    <!-- Devoluciones -->
                    <article class="col-md-4">

                        <div class="border rounded p-4 text-center">

                            <i class="bi bi-arrow-return-left fs-1 text-success"></i>

                            <h5 class="mt-2">
                                Devoluciones pendientes
                            </h5>

                            <h3>
                                5
                            </h3>

                        </div>

                    </article>


                    <!-- Reservas -->
                    <article class="col-md-4">

                        <div class="border rounded p-4 text-center">

                            <i class="bi bi-calendar-check fs-1 text-success"></i>

                            <h5 class="mt-2">
                                Reservas pendientes
                            </h5>

                            <h3>
                                8
                            </h3>

                        </div>

                    </article>

                </div>

            </section>


            <!-- Información adicional -->
            <section class="row g-4">

                <!-- Fecha y hora -->
                <article class="col-md-6">

                    <div class="border rounded p-4">

                        <h4 class="fw-bold">
                            <i class="bi bi-clock text-success me-2"></i>
                            Fecha y hora
                        </h4>

                        <p class="mt-3">
                            30/08/2026
                        </p>

                        <p>
                            03:25 PM
                        </p>

                    </div>

                </article>


                <!-- Accesos rápidos -->
                <article class="col-md-6">

                    <div class="border rounded p-4">

                        <h4 class="fw-bold">
                            <i class="bi bi-lightning text-success me-2"></i>
                            Accesos rápidos
                        </h4>

                        <div class="d-flex gap-2 mt-3">

                            <button class="btn btn-success">
                                Reservas
                            </button>

                            <button class="btn btn-success">
                                Préstamos
                            </button>

                            <button class="btn btn-success">
                                Espacios
                            </button>

                        </div>

                    </div>

                </article>

            </section>

        </section>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
