<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Interfaz de Empleado </title>
    <!-- Archivos de estilo propios -->
    <link rel="stylesheet" href="/css/sidebar.css">

    <!-- css de bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div class="app-container">
        <aside id="sidebar" class="text-white d-flex flex-column"> <!-- Sidebar -->

            <!-- Parte del nombre de la universidad y logo -->
            <header class="sidebar-header d-flex align-items-center px-4 py-3"
                    onclick="cambiarSidebar()"
                    style="cursor: pointer;">
                <i class="bi bi-mortarboard-fill fs-3"></i>
                <h4 class="mb-0 fw-bold sidebar-text ms-3">UNIVERSIDAD</h4>
            </header>

            <!-- Barra de navegación vertical -->
            <nav class="p-3">
                <ul class="nav nav-pills flex-column gap-2">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3 active"
                            onclick="cargarVista('inicio.html', this)">
                            <i class="bi bi-house-door fs-3"></i>
                            <span class="sidebar-text">Inicio</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('dashboard.html', this)">
                            <i class="bi bi-speedometer2 fs-3"></i>
                            <span class="sidebar-text">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('reservas.html', this)">
                            <i class="bi bi-calendar-check fs-3"></i>
                            <span class="sidebar-text">Reservas</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('disponibilidad.html', this)">
                            <i class="bi bi-search fs-3"></i>
                            <span class="sidebar-text">Disponibilidad y Consultas</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('prestamos.html', this)">
                            <i class="bi bi-arrow-left-right fs-3"></i>
                            <span class="sidebar-text">Préstamos y Devoluciones</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('espacios.html', this)">
                            <i class="bi bi-building fs-3"></i>
                            <span class="sidebar-text">Espacios</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('recursos.html', this)">
                            <i class="bi bi-boxes fs-3"></i>
                            <span class="sidebar-text">Recursos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('categorias.html', this)">
                            <i class="bi bi-tags fs-3"></i>
                            <span class="sidebar-text">Categorías</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white d-flex align-items-center gap-3"
                            onclick="cargarVista('estudiantes.html', this)">
                            <i class="bi bi-people-fill fs-3"></i>
                            <span class="sidebar-text">Estudiantes</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Perfil en el fondo de la sidebar -->
            <footer class="perfil mt-auto px-4 py-3">
                <div class="d-flex align-items-center justify-content-between">

                    <!-- Usuario -->
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-person-circle fs-2"></i>
                        <div class="sidebar-text">
                            <div class="fw-bold">FRANZ KAFKA</div>
                            <small class="fst-italic">Empleado</small>
                        </div>
                    </div>

                    <!-- Cerrar sesión -->
                    <a href="#" class="text-white sidebar-text" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-right fs-5"></i>
                    </a>
                </div>
            </footer>   
        </aside>  

        <!-- Contenido, funciona como un JPanel -->
        <main id="panelPrincipal"> </main>  
    </div>

    <!--javascript propio -->
    <script src="/javascript/cargarInterfacesEmpleado.js"></script>

    <!--js de bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
