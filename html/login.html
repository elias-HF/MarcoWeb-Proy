<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema de Reservas Académicas</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Tu archivo de estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100vh; margin: 0;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Tarjeta contenedora estilo Bootstrap -->
                <div class="card bg-dark-nav border-secondary shadow-lg p-4 rounded-4">
                    
                    <!-- Logo / Título del Sistema -->
                    <div class="text-center mb-4">
                        <div class="bg-success text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-2" style="width: 55px; height: 55px;">
                            <i class="bi bi-mortarboard-fill fs-3"></i>
                        </div>
                        <h4 class="fw-bold text-white mb-0">UNIVERSIDAD</h4>
                        <small class="text-secondary">Gestión de Reservas y Préstamos</small>
                    </div>

                    <!-- Pestañas para alternar entre Iniciar Sesión y Registro (F01 y F02) -->
                    <ul class="nav nav-pills nav-fill mb-4 bg-dark p-1 rounded-3" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-white bg-success py-1" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Ingresar</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-secondary py-1" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Registrarse</button>
                        </li>
                    </ul>

                    <!-- Contenido de las Pestañas -->
                    <div class="tab-content" id="pills-tabContent">
                        
                        <!-- FORMULARIO DE INICIO DE SESIÓN (F02) -->
                        <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label small text-secondary">Correo Institucional</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark border-secondary text-success"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control bg-dark text-white border-secondary" id="loginEmail" placeholder="usuario@universidad.edu">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label small text-secondary">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark border-secondary text-success"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control bg-dark text-white border-secondary" id="loginPassword" placeholder="********">
                                    </div>
                                </div>
                                <div class="d-grid mt-4">
                                    <!-- Botón de acceso simulado que redirige al index del estudiante o admin -->
                                    <a href="index.html" class="btn btn-success fw-bold py-2">Iniciar Sesión</a>
                                </div>
                            </form>
                        </div>

                        <!-- FORMULARIO DE REGISTRO PARA ESTUDIANTES NUEVOS (F01) -->
                        <div class="tab-pane fade" id="pills-register" role="tabpanel">
                            <form>
                                <div class="mb-2">
                                    <label for="regNombre" class="form-label small text-secondary">Nombre y Apellidos</label>
                                    <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="regNombre" placeholder="Fiódoro Dostoyevski">
                                </div>
                                <div class="mb-2">
                                    <label for="regEmail" class="form-label small text-secondary">Correo Institucional</label>
                                    <input type="email" class="form-control form-control-sm bg-dark text-white border-secondary" id="regEmail" placeholder="estudiante@universidad.edu">
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label small text-secondary">Contraseña</label>
                                    <input type="password" class="form-control form-control-sm bg-dark text-white border-secondary" id="regPassword" placeholder="********">
                                </div>
                                <div class="d-grid mt-3">
                                    <button type="button" class="btn btn-outline-success fw-bold py-2 btn-sm">Crear Cuenta</button>
                                </div>
                            </form>
                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle (Necesario para que funcionen las pestañas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
