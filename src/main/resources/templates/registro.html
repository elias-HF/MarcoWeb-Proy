<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Sistema de Reservas Académicas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center"
      style="min-height: 100vh; margin: 0;">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card bg-dark-nav border-secondary shadow-lg p-4 rounded-4">

                <!-- TÍTULO -->
                <div class="text-center mb-4">

                    <div class="bg-success text-white rounded-circle
                                d-inline-flex justify-content-center
                                align-items-center mb-2"
                         style="width: 55px; height: 55px;">

                        <i class="bi bi-person-plus-fill fs-3"></i>

                    </div>

                    <h4 class="fw-bold text-white mb-0">
                        CREAR CUENTA
                    </h4>

                    <small class="text-secondary">
                        Registro de estudiante
                    </small>

                </div>


                <!-- FORMULARIO DE REGISTRO -->
                <form id="formularioRegistro">

                    
                   

                    <!-- NOMBRE -->
                    <div class="mb-3">

                        <label for="regNombre"
                               class="form-label small text-secondary">

                            Nombre y Apellidos

                        </label>

                        <div class="input-group">

                            <span class="input-group-text
                                         bg-dark
                                         border-secondary
                                         text-success">

                                <i class="bi bi-person"></i>

                            </span>

                            <input
                                    type="text"
                                    class="form-control bg-dark text-white border-secondary"
                                    id="regNombre"
                                    placeholder="Ingrese su nombre completo">

                        </div>

                    </div>


                    <!-- CORREO -->
                    <div class="mb-3">

                        <label for="regEmail"
                               class="form-label small text-secondary">

                            Correo Institucional

                        </label>

                        <div class="input-group">

                            <span class="input-group-text
                                         bg-dark
                                         border-secondary
                                         text-success">

                                <i class="bi bi-envelope"></i>

                            </span>

                            <input
                                    type="email"
                                    class="form-control bg-dark text-white border-secondary"
                                    id="regEmail"
                                    placeholder="estudiante@universidad.edu">

                        </div>

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="mb-3">

                        <label for="regPassword"
                               class="form-label small text-secondary">

                            Contraseña

                        </label>

                        <div class="input-group">

                            <span class="input-group-text
                                         bg-dark
                                         border-secondary
                                         text-success">

                                <i class="bi bi-lock"></i>

                            </span>

                            <input
                                    type="password"
                                    class="form-control bg-dark text-white border-secondary"
                                    id="regPassword"
                                    placeholder="********">

                        </div>

                    </div>


                    <!-- CONFIRMAR CONTRASEÑA -->
                    <div class="mb-3">

                        <label for="regConfirmarPassword"
                               class="form-label small text-secondary">

                            Confirmar Contraseña

                        </label>

                        <div class="input-group">

                            <span class="input-group-text
                                         bg-dark
                                         border-secondary
                                         text-success">

                                <i class="bi bi-shield-lock"></i>

                            </span>

                            <input
                                    type="password"
                                    class="form-control bg-dark text-white border-secondary"
                                    id="regConfirmarPassword"
                                    placeholder="********">

                        </div>

                    </div>


                    <!-- BOTÓN REGISTRO -->
                    <div class="d-grid mt-4">

                        <button type="submit"
                                class="btn btn-success fw-bold py-2">

                            <i class="bi bi-person-check-fill me-1"></i>

                            Crear Cuenta

                        </button>

                    </div>


                    <!-- VOLVER AL LOGIN -->
                    <div class="text-center mt-4">

                        <span class="text-secondary">
                            ¿Ya tienes una cuenta?
                        </span>

                        <a href="login.html"
                           class="text-success fw-bold text-decoration-none">

                            Inicia sesión

                        </a>

                    </div>

                </form>
                  <div id="mensajeRegistro"></div>
              
                 

            </div>

        </div>

    </div>

</div>
<script src="../javascript/registro.js"></script>
</body>
</html>
