<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Sistema de Reservas Académicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh; margin: 0;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card bg-dark-nav border-secondary shadow-lg p-4 rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-2" style="width: 55px; height: 55px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-0">CREAR CUENTA</h4>
                    <small class="text-secondary">Registro de estudiante</small>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}" ></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/registro}" method="post" id="formularioRegistro">
                    <div class="mb-3">
                        <label for="nombres" class="form-label small text-secondary">Nombres Completos</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="nombres" name="nombres" placeholder="Ingrese su nombre completo" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="apellidos" class="form-label small text-secondary">Apellidos</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="apellidos" name="apellidos" placeholder="Ingrese sus apellidos" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label small text-secondary">Correo Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" placeholder="estudiante@universidad.edu" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="carrera" class="form-label small text-secondary">Carrera Profesional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-mortarboard"></i>
                            </span>
                            <select class="form-select bg-dark text-white border-secondary" id="carrera" name="carrera" required>
                                <option value="" selected disabled>Seleccione su carrera</option>
                                <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                                <option value="Ingeniería de Software">Ingeniería de Software</option>
                                <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                                <option value="Ingeniería de Redes y Comunicaciones">Ingeniería de Redes y Comunicaciones</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="codigoEstudiante" class="form-label small text-secondary">Código de Estudiante</label>
                        <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-success">
                            <i class="bi bi-card-text"></i>
                        </span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="codigoEstudiante" name="codigoEstudiante" placeholder="U20251234" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small text-secondary">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" placeholder="********" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmarPassword" class="form-label small text-secondary">Confirmar Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="confirmarPassword" name="confirmarPassword" placeholder="********" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success fw-bold py-2">
                            <i class="bi bi-person-check-fill me-1"></i>Crear Cuenta
                        </button>
                    </div>
                    <div class="text-center mt-4">
                        <span class="text-secondary">¿Ya tienes una cuenta?</span>
                        <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Inicia sesión</a>
                    </div>
                </form>
                  <div id="mensajeRegistro"></div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
