<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - Módulo Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div>
        <div th:replace="~{fragments/fragmentEstudiante::header}"></div>
        <main>
            <div class="bg-light py-4 border-bottom">
                <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <h2 class="fw-bold text-success mb-1"><i class="bi bi-calendar-check me-2"></i>Mis Reservas</h2>
                        <p class="text-muted mb-0">Consulta el estado de tus reservas de espacios académicos.</p>
                    </div>
                    <a th:href="@{/estudiante/recursos}" class="btn btn-success">
                        <i class="bi bi-plus-circle me-1"></i>Nueva Reserva
                    </a>
                </div>
            </div>
            <div class="container py-4">
                <ul class="nav nav-pills mb-4" id="filtroReservas">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${estadoSeleccionado == null} ? 'active bg-success text-white' : 'text-success'" th:href="@{/estudiante/reservas}">Todas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${estadoSeleccionado == 'PENDIENTE'} ? 'active bg-success text-white' : 'text-success'" th:href="@{/estudiante/reservas(estado='PENDIENTE')}">Pendientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${estadoSeleccionado == 'FINALIZADA'} ? 'active bg-success text-white' : 'text-success'" th:href="@{/estudiante/reservas(estado='FINALIZADA')}">Finalizadas</a>
                    </li>
                </ul>
                <div class="table-responsive shadow-sm rounded">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-success">
                            <tr>
                                <th scope="col">Espacio / Recurso</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Horario</th>
                                <th scope="col" class="text-center">Estado</th>
                                <th scope="col" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reservas}">
                                <td><i class="bi bi-door-open text-success me-2"></i><span th:text="${r.espacioAcademico != null ? r.espacioAcademico.nombre : 'Espacio de Estudio'}"></span></td>
                                <td th:text="${#temporals.format(r.fechaReserva, 'dd/MM/yyyy')}"></td>
                                <td th:text="${r.horaInicio + ' - ' + r.horaFin}"></td>
                                <td class="text-center"><span class="badge" th:classappend="${r.estado == 'PENDIENTE'} ? 'bg-warning text-dark' : (${r.estado == 'FINALIZADA'} ? 'bg-secondary' : 'bg-danger')" th:text="${r.estado}"></span></td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-outline-danger" th:if="${r.estado == 'PENDIENTE'}">
                                        <i class="bi bi-x-circle me-1"></i>Cancelar
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" th:unless="${r.estado == 'PENDIENTE'}">
                                        <i class="bi bi-eye me-1"></i>Ver Detalle
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    No se encontraron reservas registradas.
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/fragmentEstudiante::footer}"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
