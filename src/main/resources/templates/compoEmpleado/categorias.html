<!-- INTERFAZ DE CATEGORÍAS -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="fragments/fragmentEmpleado::aside(activeTab='categorias')"></div>

        <main class="flex-grow-1 p-4" id="panelPrincipal">

        <!-- Encabezado -->
        <div class="mb-4">
            <h2 class="fw-bold">
                <i class="bi bi-tags text-success me-2"></i>
                Categorías
            </h2>

            <p class="text-muted mb-0">Administra las categorías utilizadas para clasificar los recursos académicos.</p>
        </div>

        <!-- Botón registrar -->
        <div class="mb-3">
            <button class="btn btn-success">
                <i class="bi bi-plus-lg me-1"></i>
                Registrar categoría
            </button>
        </div>

        <!-- Tabla -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <i class="bi bi-list-ul me-2"></i>
                Categorías registradas
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Cantidad de recursos</th>
                            <th>Estado</th>
                            <th class="text-center">
                                Acciones
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td>
                            <i class="bi bi-folder text-success me-2"></i>
                            <span th:text="${categoria.nombre}"></span>
                        </td>
                        <td th:text="${categoria.descripcion}"></td>
                        <td th:text="${categoria.recurso != null ? 1 : 0}"></td>
                        <!--thymeleaf temporal para mostrar la cantidad como numero-->
                        <td>
                            <span th:text="${categoria.estado ? 'Activa' : 'Inactiva'}"
                                  th:class="${categoria.estado ? 'badge bg-success' : 'badge bg-secondary'}">
                            </span>
                        </td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-success me-1" title="Consultar">
                                <i class="bi bi-eye"></i>
                            </button>
                            <th:block th:if="${categoria.estado}">
                                <button class="btn btn-sm btn-outline-primary me-1" title="Modificar">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" title="Desactivar">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pie -->
            <div class="card-footer text-muted">
                <small>
                    Mostrando 4 categorías de ejemplo.
                </small>
            </div>
        </div>
    </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
