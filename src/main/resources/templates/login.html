<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Reservas Académicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100vh; margin: 0;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card bg-dark-nav border-secondary shadow-lg p-4 rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle
                                d-inline-flex justify-content-center
                                align-items-center mb-2"
                         style="width: 55px; height: 55px;">
                        <i class="bi bi-mortarboard-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-white mb-0">UNIVERSIDAD</h4>
                    <small class="text-secondary">Gestión de Reservas y Préstamos</small>
                </div>
                <form id="formularioLogin">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label small text-secondary">Correo Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input
                                type="email"
                                class="form-control bg-dark text-white border-secondary"
                                id="loginEmail"
                                placeholder="usuario@universidad.edu">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword"
                               class="form-label small text-secondary">
                            Contraseña
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-success">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input
                                type="password"
                                class="form-control bg-dark text-white border-secondary"
                                id="loginPassword"
                                placeholder="********">
                        </div>
                    </div>
                    <div class="text-end mb-3">
                        <a href="#"
                           class="text-success text-decoration-none small">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                    <div id="mensajeLogin"></div>
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-success fw-bold py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i>
                            Iniciar Sesión
                        </button>
                    </div>
                    <div class="text-center mt-4">
                        <span class="text-secondary">
                            ¿No tienes una cuenta?
                        </span>
                        <a th:href="@{/registro}" class="text-success fw-bold text-decoration-none">
                            Regístrate
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/login.js}"></script>

</body>
</html>
